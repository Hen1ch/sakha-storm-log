name: Поиск кандидатов в архив
name: Поиск кандидатов в архив

# Раз в неделю по понедельникам + вручную кнопкой.
# Для публичных репозиториев Actions бесплатны без лимита минут.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'За сколько дней искать'
        required: false
        default: '14'

permissions:
  issues: write        # только на создание Issue, больше ничего не нужно
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Диагностика: при коде возврата 2 («файл не найден») сразу видно,
      # что именно лежит в репозитории, а не приходится гадать.
      - name: Проверить, что файлы на месте
        run: |
          echo "Содержимое репозитория:"
          ls -la
          echo ""
          if [ -f scripts/scan_news.py ]; then
            echo "OK: scripts/scan_news.py найден"
          else
            echo "ОШИБКА: нет scripts/scan_news.py"
            echo "Папка scripts:"
            ls -la scripts 2>/dev/null || echo "  папки scripts вообще нет"
            echo ""
            echo "Скорее всего папка не загрузилась при перетаскивании."
            echo "Создайте файл вручную: Add file -> Create new file,"
            echo "в имя вписать целиком: scripts/scan_news.py"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Искать новости и открыть Issue с кандидатами
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCAN_DAYS: ${{ github.event.inputs.days || '14' }}
        run: python scripts/scan_news.py

name: Прогноз в группу

# Якутск живёт по UTC+9, расписание задаётся в UTC:
#   02:00 UTC = 11:00 местного — утренний выпуск: карты на день + зонд
#   14:00 UTC = 23:00 местного — вечерний: только зонд
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      maps:
        description: 'Строить карты (yes/no)'
        required: false
        default: 'yes'

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Выключатель проверяем ДО установки окружения: незачем тратить
      # пять минут на сборку, если публикация приостановлена.
      - name: Проверить выключатель
        id: gate
        run: |
          if [ -f PAUSED ] || [ -f PAUSED.txt ]; then
            echo "Приостановлено файлом PAUSED."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Решить, что публиковать
        if: steps.gate.outputs.skip == 'false'
        id: plan
        run: |
          H=$(date -u +%H)
          D=$(date -u +%Y%m%d)
          IN='${{ github.event.inputs.maps }}'
          # Дату указываем явно: без неё час читается как дата.
          # Утренний запуск в 02 UTC берёт зонд 00 UTC того же дня —
          # он выпущен два часа назад и уже на сервере.
          if [ "$H" -lt "08" ]; then
            echo "sounding=/fact 24959 $D 00" >> $GITHUB_OUTPUT
            echo "stitle=Утреннее зондирование Якутска" >> $GITHUB_OUTPUT
            echo "maps=${IN:-yes}" >> $GITHUB_OUTPUT
          else
            echo "sounding=/fact 24959 $D 12" >> $GITHUB_OUTPUT
            echo "stitle=Вечернее зондирование Якутска" >> $GITHUB_OUTPUT
            echo "maps=${IN:-no}" >> $GITHUB_OUTPUT
          fi

      - name: Поставить окружение
        if: steps.gate.outputs.skip == 'false'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # Карты первыми: они дольше считаются, и если упадут, зондирование
      # всё равно уйдёт — оно в отдельном шаге.
      - name: Построить карты
        if: steps.gate.outputs.skip == 'false' && steps.plan.outputs.maps == 'yes'
        continue-on-error: true
        shell: bash -el {0}
        run: python maps_headless.py --config maps.json --out maps_out

      - name: Отправить карты
        if: steps.gate.outputs.skip == 'false' && steps.plan.outputs.maps == 'yes'
        continue-on-error: true
        shell: bash -el {0}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python send_maps.py --dir maps_out

      - name: Отправить зондирование
        if: steps.gate.outputs.skip == 'false'
        shell: bash -el {0}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          python daily_post.py --command "${{ steps.plan.outputs.sounding }}" \
                               --title "${{ steps.plan.outputs.stitle }}"
